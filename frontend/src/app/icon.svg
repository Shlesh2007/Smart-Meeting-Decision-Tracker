<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Inner Highlight Ring -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Thunderbolt Brand Icon -->
  <path d="M 37 8 L 19 34 L 31 34 L 27 56 L 45 30 L 33 30 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"/>
</svg>
