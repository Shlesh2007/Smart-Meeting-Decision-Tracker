<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Blue Rounded Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" />

  <!-- Calendar Outer Frame -->
  <rect x="20" y="24" width="60" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="4.5" />
  
  <!-- Calendar Inner Window Header Line -->
  <line x1="20" y1="36" x2="80" y2="36" stroke="#ffffff" stroke-width="3" />

  <!-- Top Calendar Rings -->
  <rect x="34" y="17" width="5" height="10" rx="2.5" fill="#ffffff" />
  <rect x="61" y="17" width="5" height="10" rx="2.5" fill="#ffffff" />

  <!-- Users Silhouette inside Calendar -->
  <!-- Left User -->
  <circle cx="37" cy="46" r="4.5" fill="#ffffff" />
  <path d="M 29 57 C 29 51, 45 51, 45 57" fill="#ffffff" />

  <!-- Right User -->
  <circle cx="63" cy="46" r="4.5" fill="#ffffff" />
  <path d="M 55 57 C 55 51, 71 51, 71 57" fill="#ffffff" />

  <!-- Center Primary User -->
  <circle cx="50" cy="44" r="6" fill="#ffffff" />
  <path d="M 40 58 C 40 51, 60 51, 60 58" fill="#ffffff" />

  <!-- Green Checkmark Badge -->
  <circle cx="73" cy="69" r="15" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3.5" />
  <path d="M 66 69 L 71 74 L 80 63" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
